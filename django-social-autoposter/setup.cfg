[metadata]
name = django-social-autoposter
version = 0.2.0
description = A reusable Django REST Framework package for broadcasting posts simultaneously across Facebook, Instagram, Threads, TikTok, X (Twitter), LinkedIn, and more.
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/osiota10/blog_DRF_api
author = Osiota Samuel Obrozie
author_email = osiotaobrozie@gmail.com
license = BSD-3-Clause
classifiers =
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 5.0
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
include_package_data = true
packages = find:
python_requires = >=3.10
install_requires =
    Django >= 5.0
    djangorestframework >= 3.14.0
    requests >= 2.28.0
    requests-oauthlib >= 1.3.0
